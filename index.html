<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui" />
  <meta name="theme-color" content="" />
  <title>Hello Vue World!</title>

  <!-- Establish early connections to CDN servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- CDN CSS Stylesheets -->
  <link crossorigin="anonymous"
    href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet" />
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css"
    rel="stylesheet" />
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet" />

  <!-- CDN JavaScript Libraries -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/vue-router@2.x/dist/vue-router.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/vuex@3.x/dist/vuex.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/axios@0.x/dist/axios.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/vue-gtag@1.16.1/dist/vue-gtag.umd.min.js"></script>

  <!-- Module Preloads to prevent waterfall loading -->
  <link rel="modulepreload" href="./src/main.js" />
  <link rel="modulepreload" href="./src/app.vue.js" />
  <link rel="modulepreload" href="./src/router.js" />
  <link rel="modulepreload" href="./src/store.js" />

  <!-- Main Entry Point -->
  <script type="module" src="./src/main.js"></script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
